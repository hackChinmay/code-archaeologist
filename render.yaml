services:
  - type: web
    name: code-archaeologist-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:5173,https://*.vercel.app,*
      - key: DATABASE_URL
        value: sqlite:///./code_archaeologist.db
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_data
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: MAX_REPO_FILES
        value: "60"
      - key: MAX_FILE_SIZE_BYTES
        value: "262144"
      - key: MAX_REPO_TOTAL_SIZE_BYTES
        value: "10485760"
